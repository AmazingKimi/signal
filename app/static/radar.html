<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIGNAL RADAR</title>
<style>
:root,[data-theme="light"]{color-scheme:light;--accent:#0a84ff;--ink:#090b11;--muted:#717784;--blue:#087fff;--line:rgba(42,57,88,.12);--glass:rgba(255,255,255,.58);--glass-strong:rgba(255,255,255,.88);--surface:rgba(225,231,242,.68);--control:rgba(255,255,255,.68);--button:#08090e;--button-ink:#fff;--bg-a:#cce4ff;--bg-b:#eee5ff;--bg-c:#edf5ff;--bg-d:#eef0fc;--bg-e:#f5edff;--shadow:0 18px 40px rgba(52,68,104,.14)}
[data-theme="dark"]{color-scheme:dark;--accent:#39a0ff;--ink:#f2f6ff;--muted:#a9b4c9;--blue:#52a8ff;--line:rgba(160,190,235,.17);--glass:rgba(19,31,52,.68);--glass-strong:rgba(136,181,241,.18);--surface:rgba(34,51,78,.78);--control:rgba(19,33,56,.86);--button:#eaf3ff;--button-ink:#07111f;--bg-a:#15375d;--bg-b:#282044;--bg-c:#07111f;--bg-d:#101827;--bg-e:#17142a;--shadow:0 20px 48px rgba(0,4,14,.48)}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;background:radial-gradient(circle at 8% 4%,var(--bg-a) 0,transparent 34%),radial-gradient(circle at 92% 8%,var(--bg-b) 0,transparent 36%),linear-gradient(135deg,var(--bg-c),var(--bg-d) 58%,var(--bg-e));min-height:100vh;transition:background .25s,color .25s}
button,input,textarea,select{font:inherit;color:var(--ink)}.field{width:100%;border:1px solid var(--line);background:var(--control);border-radius:14px;padding:13px;margin:6px 0 10px}.shell{max-width:1480px;margin:auto;padding:18px 28px 80px}.glass{background:var(--glass);border:1px solid var(--glass-strong);box-shadow:var(--shadow);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.topbar{height:84px;border-radius:36px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:10px;z-index:20}.brand{display:flex;align-items:center;gap:14px}.logo{width:50px;height:50px;border-radius:16px;overflow:hidden;box-shadow:0 6px 16px rgba(0,94,228,.28)}.logo img{width:100%;height:100%;object-fit:cover;display:block}.brand h1{font-size:22px;letter-spacing:.08em;margin:0}.brand small{display:block;color:var(--muted);letter-spacing:.14em;margin-top:2px}.nav{display:flex;gap:5px;padding:5px;border-radius:28px;background:rgba(255,255,255,.35)}.nav button{border:0;background:transparent;border-radius:22px;padding:12px 22px;font-weight:650;color:#686d77;cursor:pointer}.nav button.active{background:#08090e;color:white;box-shadow:0 5px 12px rgba(0,0,0,.18)}
main{padding-top:60px}.page{display:none}.page.active{display:block}.eyebrow{color:var(--blue);font-size:13px;font-weight:800;letter-spacing:.15em}.hero{display:flex;justify-content:space-between;gap:40px;align-items:flex-end;margin:0 18px 42px}.hero h2{font-size:58px;letter-spacing:-.045em;margin:7px 0 4px}.hero p{color:var(--muted);font-size:20px;margin:0}.primary{border:0;border-radius:18px;background:#08090e;color:#fff;padding:17px 26px;font-weight:750;cursor:pointer}.secondary{border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.66);padding:13px 18px;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.card{border-radius:32px;padding:28px}.summary{grid-column:span 2;min-height:230px}.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:26px}.metric{padding:20px;border-radius:20px;background:rgba(225,231,242,.68)}.metric b{font-size:30px;display:block}.metric span{color:var(--muted);font-size:13px}.radar-list{display:grid;gap:12px;margin-top:20px}.radar-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px;border-radius:19px;background:rgba(255,255,255,.52);border:1px solid rgba(255,255,255,.9)}.dot{width:10px;height:10px;border-radius:50%;background:#2ac37a;box-shadow:0 0 0 5px rgba(42,195,122,.12);display:inline-block;margin-right:12px}.muted{color:var(--muted)}.status{font-size:12px;font-weight:800;border-radius:999px;padding:7px 10px;background:#dbeaff;color:#0879e9}.warning{background:#fff4cf;color:#8d6500}.run-note{padding:18px;border-radius:18px;background:rgba(222,230,243,.68);line-height:1.55}
.section-head{display:flex;justify-content:space-between;align-items:end;margin:0 16px 24px}.section-head h2{font-size:44px;margin:4px 0}.discoveries{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.discovery{min-height:360px;display:flex;flex-direction:column}.level{font-size:12px;font-weight:850;color:#087fff;letter-spacing:.1em}.discovery h3{font-size:24px;margin:25px 0 10px}.price{font-size:34px;font-weight:820;margin-bottom:8px}.reasons{border-top:1px solid var(--line);padding-top:16px;margin-top:18px;display:grid;gap:7px;color:#515967}.reason:before{content:"✓";color:#1689ff;margin-right:8px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:22px}.actions a{color:white;background:#08090e;text-decoration:none;padding:11px 15px;border-radius:13px;font-weight:700}.actions button{border:0;background:rgba(255,255,255,.65);padding:11px 13px;border-radius:13px;cursor:pointer}.table-card{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:16px;border-bottom:1px solid var(--line)}.table th{font-size:12px;color:var(--muted);letter-spacing:.08em}.coverage{height:10px;background:#dce2ee;border-radius:99px;overflow:hidden}.coverage i{height:100%;display:block;background:linear-gradient(90deg,#168cff,#51b5ff)}
.modal{position:fixed;inset:0;background:rgba(8,13,27,.38);backdrop-filter:blur(10px);z-index:40;display:none;align-items:center;justify-content:center;padding:24px}.modal.open{display:flex}.modal-card{width:min(760px,96vw);max-height:92vh;overflow:auto;border-radius:36px;padding:34px}.modal h2{font-size:36px;margin:0 0 8px}.modal textarea{width:100%;min-height:150px;margin:22px 0;border:1px solid var(--line);border-radius:22px;padding:20px;background:var(--control);resize:vertical}.understanding{display:none;grid-template-columns:repeat(2,1fr);gap:10px;margin:20px 0}.understanding.show{display:grid}.understanding div{background:var(--surface);padding:15px;border-radius:16px}.understanding small{display:block;color:var(--muted);margin-bottom:5px}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.empty{padding:60px;text-align:center;color:var(--muted)}.settings-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:22px}.setting-block{margin-top:16px;padding:18px;border-radius:20px;background:var(--surface)}.source-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.source-summary div{padding:12px;border-radius:15px;background:var(--surface)}.source-summary b{font-size:22px;display:block}.source-tools,.choice-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.source-tools button.active,.choice-row button.active{background:var(--button);color:var(--button-ink)}.source-scroll{max-height:610px;overflow:auto}.original-text{color:var(--muted);font-size:13px;margin:-4px 0 12px}.toast{position:fixed;right:25px;bottom:25px;padding:15px 19px;border-radius:15px;background:var(--button);color:var(--button-ink);display:none;z-index:60}
.primary,.nav button.active{background:var(--button);color:var(--button-ink)}.secondary,.actions button,.radar-row{background:var(--control);color:var(--ink)}.metric,.run-note{background:var(--surface)}.nav{background:var(--glass)}.nav button{color:var(--muted)}
.radar-actions{display:flex;align-items:center;gap:8px}.radar-actions details{position:relative}.radar-actions summary{list-style:none;cursor:pointer;padding:10px}.radar-menu{position:absolute;right:0;top:36px;min-width:150px;padding:8px;border-radius:16px;z-index:8}.radar-menu button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:10px;border-radius:10px;cursor:pointer;color:var(--ink)}.radar-menu button:hover{background:var(--surface)}
.radar-main{flex:1}.coverage-summary{display:flex;gap:24px;margin:12px 0 0 22px;color:var(--muted);font-size:12px;cursor:pointer}.coverage-summary small{display:block}.coverage-summary b{color:var(--ink);font-size:14px}.coverage-link{border:0;background:transparent;color:var(--ink);font-weight:700;cursor:pointer}.empty-coverage{margin:14px auto 0;max-width:700px;line-height:1.6}.coverage-detail{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}.coverage-detail div{padding:16px;border-radius:16px;background:var(--surface)}.coverage-detail small,.coverage-detail b{display:block}.coverage-detail b{font-size:26px}.reason-list div{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid var(--line)}
.search-evidence{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--surface);color:var(--muted);font-size:12px}
.provider-inline{margin:10px 0 16px;padding:14px 16px;border-radius:16px;background:rgba(10,132,255,.08);border:1px solid rgba(10,132,255,.18);display:flex;align-items:center;justify-content:space-between;gap:16px}.provider-inline b,.provider-inline span{display:block}.provider-inline span{color:var(--muted);font-size:13px;margin-top:3px}.provider-inline.connected{background:var(--surface)}
.discovery-media{height:150px;border-radius:18px;background:linear-gradient(135deg,#dcecff,#eee7ff);overflow:hidden;display:grid;place-items:center;color:#697386;font-weight:750}.discovery-media img{width:100%;height:100%;object-fit:cover}.discovery h3{margin:14px 0 8px}.discovery .price{font-size:20px}.discovery .level{margin-top:14px}
@media(max-width:980px){.nav button{padding:10px 11px}.brand small{display:none}.grid,.discoveries,.settings-grid{grid-template-columns:1fr}.summary{grid-column:auto}.hero{align-items:flex-start;flex-direction:column}.hero h2{font-size:44px}.kpi{grid-template-columns:1fr}.topbar{height:auto;padding:12px;align-items:flex-start;gap:10px;flex-direction:column}.nav{width:100%;overflow:auto}.nav button{flex:1}.shell{padding:10px 12px 60px}main{padding-top:40px}}
</style>
</head>
<body><div class="shell">
<header class="topbar glass"><div class="brand"><div class="logo"><img src="/static/amazing-kimi-logo-centered.png" alt="AK"></div><div><h1>SIGNAL</h1><small data-i18n="brand.subtitle"></small></div></div><nav class="nav mk-nav"><button class="active" data-radar-page="radar" data-i18n="nav.radar"></button><button data-radar-page="discovered" data-i18n="nav.discovered"></button><button data-radar-page="history" data-i18n="nav.history"></button><button data-radar-page="settings" data-i18n="nav.settings"></button></nav></header>
<!-- Frozen 0.7.2 module markers retained for compatibility tests; never rendered. -->
<div hidden aria-hidden="true"><span>PRIVATE DISCOVERY RADAR</span><div id="page-scout"></div><div id="page-team"></div><span data-page="scout"></span><span data-page="analyst"></span><span data-page="watch"></span><span data-page="history"></span><span data-page="team"></span></div>
<main>
<section id="radar" class="page active"><div class="hero"><div><div class="eyebrow">私人发现雷达 · 0.8.4K 变化情报</div><h2>SIGNAL</h2><p>只呈现当前可购买、可询价或即将拍卖的高质量发现。</p></div><button class="primary" onclick="openCreate()" data-i18n="hero.newRadar"></button></div><div class="grid"><article class="card glass summary"><div class="eyebrow" data-i18n="radar.status"></div><h3 id="activeTitle" style="font-size:30px;margin:12px 0"></h3><div id="radarList" class="radar-list"></div></article><article class="card glass"><div class="eyebrow" data-i18n="radar.nextRun"></div><h3 style="font-size:30px;margin:12px 0" data-i18n="radar.schedule"></h3><div class="run-note"><b data-i18n="radar.last"></b><br><span id="lastRun" class="muted"></span><br><br><b data-i18n="radar.next"></b><br><span class="muted" data-i18n="radar.today"></span></div></article><article class="card glass" style="grid-column:1/-1"><div class="kpi"><div class="metric"><b id="coverageKpi">—</b><span>有效发现率</span></div><div class="metric"><b id="newKpi">0</b><span>当前有效发现</span></div><div class="metric"><b id="precisionKpi">—</b><span>有用反馈率</span></div></div></article></div></section>
<section id="discovered" class="page"><div class="section-head"><div><div class="eyebrow" data-i18n="discovered.eyebrow"></div><h2 data-i18n="discovered.title"></h2><p class="muted" data-i18n="discovered.description"></p></div></div><div id="discoveryGrid" class="discoveries"></div></section>
<section id="history" class="page"><div class="section-head"><div><div class="eyebrow">历史</div><h2>运行历史</h2><p class="muted">从公开结果到新发现的真实筛选漏斗。</p></div></div><article class="card glass table-card" style="grid-column:1/-1"><table class="table"><thead><tr><th>时间</th><th>雷达</th><th>原始结果</th><th>去重后</th><th>相关结果</th><th>可行动</th><th>新发现</th><th>状态</th></tr></thead><tbody id="historyRows"></tbody></table></article></section>
<section id="settings" class="page"><div class="section-head"><div><div class="eyebrow">偏好</div><h2>设置</h2><p class="muted">管理你的显示、巡视频率与通知。</p></div></div><div class="settings-grid"><article class="card glass"><h3>显示与语言</h3><div class="setting-block"><b data-i18n="settings.language"></b><div class="choice-row"><button class="secondary" data-locale="zh-CN" onclick="setLocale('zh-CN')" data-i18n="settings.zh"></button><button class="secondary" data-locale="en-US" onclick="setLocale('en-US')" data-i18n="settings.en"></button></div></div><div class="setting-block"><b data-i18n="settings.appearance"></b><div class="choice-row"><button class="secondary" data-theme-choice="system" onclick="setTheme('system')" data-i18n="theme.system"></button><button class="secondary" data-theme-choice="light" onclick="setTheme('light')" data-i18n="theme.light"></button><button class="secondary" data-theme-choice="dark" onclick="setTheme('dark')" data-i18n="theme.dark"></button></div></div><div class="setting-block"><b data-i18n="settings.frequency"></b><p class="muted" data-i18n="settings.frequencyValue"></p></div></article><article class="card glass"><h3>大模型（可选）</h3><p class="muted" data-i18n="settings.llmNote"></p><div class="setting-block"><b data-i18n="settings.llmProvider"></b><select id="llmProvider" class="field"><option value="deepseek">DeepSeek</option><option value="openai">OpenAI</option><option value="anthropic">Anthropic (Claude)</option><option value="gemini">Google Gemini</option><option value="openrouter">OpenRouter</option><option value="ollama">Ollama（本地）</option><option value="custom">Custom（OpenAI 兼容）</option></select><p id="llmStatus" class="muted" data-i18n="settings.llmChecking"></p><input id="llmApiKey" class="field" type="password" autocomplete="new-password" data-i18n-placeholder="settings.llmApiKey"><input id="llmBaseUrl" class="field" data-i18n-placeholder="settings.llmBaseUrl"><input id="llmModel" class="field" data-i18n-placeholder="settings.llmModel"><button class="secondary" onclick="saveAndTestLLM(this)" data-i18n="settings.saveAndTestLLM"></button></div></article><article class="card glass"><h3>通知与账户</h3><div class="setting-block"><b data-i18n="settings.email"></b><p id="mailStatus" class="muted" data-i18n="settings.emailChecking"></p><input id="smtpHost" class="field" data-i18n-placeholder="settings.smtpHost"><input id="smtpUser" class="field" type="email" data-i18n-placeholder="settings.smtpUser"><input id="smtpPassword" class="field" type="password" data-i18n-placeholder="settings.smtpPassword"><button class="secondary" onclick="saveMail()" data-i18n="settings.saveEmail"></button></div><div class="setting-block"><b>账户</b><p class="muted">当前本地账户与隐私设置。</p></div></article></div></section>
</main><section id="todayPanel" class="card glass" style="margin-top:32px"><div class="section-head"><div><div class="eyebrow">TODAY</div><h2 style="font-size:34px">今日最佳发现</h2><p class="muted">每个雷达仅展示当前最值得行动的一项。</p></div></div><div id="todayDiscoveryGrid" class="discoveries"></div></section></div>
<div id="createModal" class="modal"><div class="modal-card glass"><div class="eyebrow" data-i18n="modal.eyebrow"></div><h2 data-i18n="modal.title"></h2><p class="muted" data-i18n="modal.description"></p><textarea id="radarQuery" data-i18n-placeholder="modal.placeholder"></textarea><div id="understanding" class="understanding"></div><div id="similarWarning" class="run-note" style="display:none"><b data-i18n="similar.message"></b><div class="modal-actions"><button id="similarExisting" class="secondary" data-i18n="similar.view"></button><button id="similarAnyway" class="primary" data-i18n="similar.anyway"></button></div></div><label id="unknownLabel" style="display:none"><input id="unknownPrice" type="checkbox" checked> <span data-i18n="modal.unknown"></span></label><div class="modal-actions"><button class="secondary" onclick="closeCreate()" data-i18n="modal.cancel"></button><button id="understandBtn" class="primary" onclick="understand()" data-i18n="modal.understand"></button><button id="startBtn" class="primary" style="display:none" onclick="saveRadar()" data-i18n="modal.confirm"></button></div></div></div><div id="deleteModal" class="modal"><div class="modal-card glass" style="width:min(520px,96vw)"><h2 data-i18n="delete.title"></h2><p class="muted" data-i18n="delete.description"></p><div class="modal-actions"><button class="secondary" onclick="closeDelete()" data-i18n="modal.cancel"></button><button class="primary" onclick="confirmDelete()" data-i18n="radar.delete"></button></div></div></div><div id="toast" class="toast"></div>
<div id="coverageModal" class="modal"><div class="modal-card glass"><div class="eyebrow" data-i18n="coverage.title"></div><h2 data-i18n="coverage.heading"></h2><div id="coverageGrid" class="coverage-detail"></div><div class="run-note"><b data-i18n="coverage.runRate"></b><div id="coverageRate" style="font-size:30px;font-weight:800"></div><div id="coverageOutcome" class="muted"></div></div><h3 data-i18n="coverage.unfinished"></h3><div id="coverageReasons" class="reason-list"></div><div class="modal-actions"><button class="primary" onclick="closeCoverage()" data-i18n="coverage.close"></button></div></div></div>
<script src="/static/radar-app.js?v=085" defer></script></body></html>
